version: '3.8'

services:
  api-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih_police_intelligence_backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8080}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - AUDIT_DB_PATH=/app/data/audit_log.db
      - DATABASE_URL=${DATABASE_URL:-postgresql://police_admin:secure_police_pass@db:5432/police_intelligence}
    volumes:
      - audit-data:/app/data
    networks:
      - police-network
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: sih_police_intelligence_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-police_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-police_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_police_pass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - police-network
    ports:
      - "5432:5432"

networks:
  police-network:
    driver: bridge

volumes:
  postgres-data:
  audit-data:
